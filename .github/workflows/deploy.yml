name: Deploy

# Runs after CI passes on main. Authenticates to Google Cloud with Workload Identity
# Federation (no service-account keys stored in GitHub).

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/hospitality/elt

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Update Cloud Run jobs
        run: |
          for job in hosp-daily hosp-intraday-pos; do
            gcloud run jobs update "$job" --image "${IMAGE}:${GITHUB_SHA}" --region "$REGION"
          done

      - name: Deploy webhook receiver
        run: |
          gcloud run deploy hosp-webhooks --image "${IMAGE}:${GITHUB_SHA}" --region "$REGION"

      - name: Smoke test webhook health endpoint
        run: |
          url=$(gcloud run services describe hosp-webhooks --region "$REGION" --format 'value(status.url)')
          curl --fail --silent "$url/healthz"
